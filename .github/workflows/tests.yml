name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      # The suite is offline; no API key is needed to run it.
      - run: PYTHONPATH=src python -m unittest discover -s tests -t tests
      - run: pip install .
      - run: skill-picker --help
